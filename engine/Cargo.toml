[workspace]
members = [
    "crates/engine",
    "crates/renderer_vulkan",
    "crates/kani_volcano_math",
    "crates/kani_volcano_text",
    "examples/basic_3d",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"

[profile.dev]
opt-level=1

[profile.release]
opt-level=3
lto="thin"
codegen-units=1

[workspace.dependencies]
anyhow = "1"
cgmath = "0.18"
log = "0.4"
png = "0.17"
pretty_env_logger = "0.5"
thiserror = "1"
tobj = { version = "3", features = ["log"] }
vulkanalia = { version = "=0.35.0", features = ["libloading", "provisional", "window"] }
winit = "0.29"
